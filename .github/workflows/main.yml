name: Continuous Integration

on:
  push:
    tags: ['*']
    branches: ['main']
  pull_request:

env:
  IMAGE_NAME: bergamot-build

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME
    steps:
      - uses: actions/checkout@v6
      - name: Compile
        run: make verilogsim
